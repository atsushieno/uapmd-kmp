#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx16384M
#Gradle
org.gradle.jvmargs=-Xmx16384M -Dfile.encoding=UTF-8
org.gradle.caching=true
#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
#cinterop
kotlin.mpp.enableCInteropCommonization=true
org.jetbrains.compose.experimental.macos.enabled=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false
# Kotlin 2.4.10's incremental klib compile of wasmJs crashes with BufferUnderflowException
# (WasmKlibCheckers) after any source edit. Kotlin2JsCompile stays incremental while either
# of these is true, so both must be off.
kotlin.incremental.js=false
kotlin.incremental.js.klib=false
